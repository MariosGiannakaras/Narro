name: Autostart Minimal Lockfile

on:
  push:
    branches: [ "m1-windows-autostart" ]
    paths:
      - ".github/workflows/autostart-minimize-lock.yml"

permissions:
  contents: write

jobs:
  minimize-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1-windows-autostart
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Re-resolve from main lockfile
        run: |
          git show origin/main:src-tauri/Cargo.lock > src-tauri/Cargo.lock
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/autostart-minimize-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "Minimize autostart lockfile update"
          git push origin HEAD:m1-windows-autostart
