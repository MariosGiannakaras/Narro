name: Blitzit video corpus handoff

on:
  push:
    branches:
      - evidence/blitzit-video-analysis-20260927
    paths:
      - .github/workflows/blitzit-video-corpus-handoff.yml

permissions:
  contents: read

jobs:
  package-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Verify corpus inventory
        shell: bash
        run: |
          set -euo pipefail
          video_count="$(find reference/original-blitzit-videos/inbox -maxdepth 1 -type f -iname '*.mp4' | wc -l)"
          transcript_count="$(find reference/original-blitzit-videos/inbox -maxdepth 1 -type f -iname '*.srt' | wc -l)"
          test "$video_count" -eq 19
          test "$transcript_count" -eq 19

      - name: Upload raw corpus for analysis
        uses: actions/upload-artifact@v4
        with:
          name: blitzit-video-transcript-corpus
          path: |
            reference/original-blitzit-videos/inbox/*.mp4
            reference/original-blitzit-videos/inbox/*.srt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
