name: Temporary M2 Docs Reconcile

on:
  push:
    branches:
      - m2-completion-docs

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'Reconcile M2 completion docs') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-completion-docs
      - name: Reconcile milestone documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import re

          todo = Path('TODO.md')
          text = todo.read_text(encoding='utf-8')
          replacements = {
              '- [ ] Implement EST, Time Taken, completion timestamp, scheduled date/time, recurrence metadata, and archive state.': '- [x] Implement EST, Time Taken, completion timestamp, scheduled date/time, recurrence metadata, and archive state.',
              '- [ ] Implement subtasks with ordering/completion state.': '- [x] Implement subtasks with ordering/completion state.',
              '- [ ] Implement rich-note storage using a constrained local document format.': '- [x] Implement rich-note storage using a constrained local document format.',
              '- [ ] Implement preferences and schema defaults.': '- [x] Implement preferences and schema defaults.',
              '- [ ] Implement permanent-task-delete semantics so deleted tasks no longer appear in user-facing reports, matching current official behavior.': '- [x] Implement permanent-task-delete semantics so deleted tasks no longer appear in user-facing reports, matching current official behavior.',
              '- [ ] Ensure successful create/edit/move is committed locally before success is reflected in UI state.': '- [x] Establish a persistence-first create/edit/move success boundary; future UI state must update only after the resolved local mutation succeeds.',
              '- [ ] Add deterministic fixture builders for tests.': '- [x] Add deterministic fixture builders for tests.',
              '- [ ] Add repeated drag/drop and scheduled-lane-move tests based on publicly reported source-product duplication/reorder failures.': '- [x] Add repeated reorder/move and scheduled-lane-move tests based on publicly reported source-product duplication/reorder failures.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'TODO replacement mismatch: {old!r}')
              text = text.replace(old, new)
          marker = '- permanent deletion is explicit, tested, and excluded from user-facing reports\n'
          if marker not in text:
              raise SystemExit('M2 acceptance marker missing')
          text = text.replace(marker, marker + '\n**Gate B result: PASS / proceed to Milestone 3.** Domain/persistence invariants are automated-validated; product UI integration must preserve the persistence-first mutation boundary.\n', 1)
          todo.write_text(text, encoding='utf-8')

          status = Path('STATUS.md')
          text = status.read_text(encoding='utf-8')
          old_phase = '**Milestone 2 — Domain model, identity invariants, and local persistence.**'
          if text.count(old_phase) != 1:
              raise SystemExit('STATUS phase marker mismatch')
          text = text.replace(old_phase, '**Milestone 3 — Timer/session engine.**', 1)
          replacement = '''## Milestone 2 completion\n\n**Result: PASS / proceed to Milestone 3.**\n\nMilestone 2 is now automated-validated through PR #21. Durable coverage includes IDs/schema/migrations, list/task/subtask lifecycle, stable ordering and duplication invariants, Time Taken and typed schedule metadata, recurrence metadata persistence, constrained rich notes, versioned preferences/defaults, explicit permanent-delete report exclusion, deterministic fixtures, persistence-first mutation visibility, and repeated scheduled-lane move/reorder corruption regressions.\n\nCompletion evidence: `work-log/2026-09-03-chatgpt-m2-completion.md`.\n\nThe active source boundary is now the Rust timer/session engine. Scheduling classification, recurrence materialization, reminder firing and DST/week semantics remain Milestone 4.\n\nProduct UI remains intentionally unpolished while Milestones 3–4 establish correctness-critical behavior.'''
          pattern = r'## Active Milestone 2 work\n.*?Product UI remains intentionally unpolished while Milestones 2–4 establish correctness-critical behavior\.'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('STATUS active-M2 section mismatch')
          status.write_text(text, encoding='utf-8')

          handoff = Path('HANDOFF.md')
          text = handoff.read_text(encoding='utf-8')
          old_milestone = '**Milestone 2 — Domain model, identity invariants, and local persistence.**'
          if text.count(old_milestone) != 1:
              raise SystemExit('HANDOFF milestone marker mismatch')
          text = text.replace(old_milestone, '**Milestone 3 — Timer/session engine.**', 1)
          replacement = '''## VALIDATED MILESTONE 2 BASELINE\n\nMilestone 2 is complete and automated-validated. Canonical completion evidence is `work-log/2026-09-03-chatgpt-m2-completion.md`. The latest closing slices are:\n\n- PR #15 / merge `106867b40d1c13572e11468b9217a9738a453036`: recurrence metadata persistence; Windows CI #101 PASS.\n- PR #16 / merge `78039b5c2bb71386edf8b0ac97cc2534e524190a`: subtask persistence; Windows CI #105 PASS.\n- PR #17 / merge `1ef6da2ab1996c71c8706e2eac7ebf98bf197253`: constrained rich-note persistence; Windows CI #108 PASS.\n- PR #19 / merge `e662eddfffb3f747d36b9b5121461bf48cf18b8e`: typed/versioned preferences + defaults; Windows CI #109 PASS.\n- PR #20 / merge `253c306aa0cdd73ee47dc5db1f508c21a6c5d632`: permanent-delete report-exclusion regression; Windows CI #111 PASS.\n- PR #21 / merge `16bb8b3e2fc2ac44c23c31268ad92bf1cdf8b7a3`: deterministic fixtures, scheduled-lane move/reorder stress, persistence-first mutation visibility; Windows CI #113 PASS.\n\nPreserve the stable-ID, exact-set reorder, archive/history, date-only/local-datetime, recurrence-linkage and persistence-first mutation invariants established in M2.\n\n## NEXT AGENT ACTION — MILESTONE 3\n\nContinue the narrow **authoritative timer state-machine** slice already prepared on branch `m3-timer-state-machine`.\n\n1. Keep exactly one authoritative Rust timer engine; do not create renderer-owned timer state.\n2. Validate idle/running/paused/break/time-up/overtime transitions with controlled/fake time.\n3. Preserve timestamp-derived elapsed work independently from renderer sampling cadence.\n4. Keep pause/resume idempotent and break time distinct from work time.\n5. Preserve explicit EST `Time's Up` and Extend/overtime semantics.\n6. Pomodoro may transition work -> break automatically, but notification delivery/session-row persistence/event emission remain later M3 slices.\n7. After the pure engine is validated/merged, add transactional session-row persistence without per-second SQLite writes, restart recovery to paused, and duplicate-running-session protection.\n8. Use exact-head Windows CI as the authoritative compile/Clippy/test/release gate.\n\nDo not pull Milestone 4 scheduling/recurrence materialization into the timer engine.\n\n'''
          pattern = r'## VALIDATED MILESTONE 2 BASELINE\n.*?(?=## USER ACTION REQUIRED)'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('HANDOFF baseline/action block mismatch')
          handoff.write_text(text, encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 reconcile_docs.py
          python reconcile_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item reconcile_docs.py
      - name: Commit documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md STATUS.md HANDOFF.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'No documentation changes produced.' }
          git commit -m "Reconcile M2 completion docs"
          git push origin HEAD:m2-completion-docs
