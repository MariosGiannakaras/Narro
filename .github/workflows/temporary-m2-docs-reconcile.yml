name: Temporary M2 Docs Reconcile

on:
  push:
    branches:
      - m2-docs-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message != 'Reconcile Milestone 2 progress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-docs-reconcile
      - name: Reconcile durable M2 state
        run: python .github/scripts/reconcile_m2_docs.py
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md STATUS.md HANDOFF.md work-log/2026-09-03-chatgpt-m2-task-identity-progress.md
          git commit -m "Reconcile Milestone 2 progress"
          git push origin HEAD:m2-docs-reconcile
