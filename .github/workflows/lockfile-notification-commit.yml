name: Notification Lockfile Commit

on:
  push:
    branches: [ "m1-windows-notifications" ]
    paths:
      - ".github/workflows/lockfile-notification-commit.yml"

permissions:
  contents: write

jobs:
  commit-lockfile:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1-windows-notifications
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate updated Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit generated lockfile if changed
        shell: pwsh
        run: |
          if (git diff --quiet -- src-tauri/Cargo.lock) {
            Write-Host "Cargo.lock is already current"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "Update Cargo lock for notifications"
          git push origin HEAD:m1-windows-notifications
