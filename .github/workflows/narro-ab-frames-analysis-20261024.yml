name: Narro frozen-media evidence analysis bridge (isolated)
on:
  push:
    branches:
      - analysis/narro-20261024-exact-ab-frame-review
permissions:
  contents: read
jobs:
  original-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            analysis
            work-log/evidence/physical-native-final-20261024/A02-normal-qpc
            work-log/evidence/physical-native-final-20261024/B02-normal-qpc
      - name: Verify ffmpeg availability
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          command -v git
          python3 --version
      - name: Restore latest immutable G28 frames (analysis only)
        shell: bash
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin main
          git restore --source=FETCH_HEAD --worktree -- work-log/evidence/physical-native-final-20261024/A02-normal-qpc work-log/evidence/physical-native-final-20261024/B02-normal-qpc
          test -f work-log/evidence/physical-native-final-20261024/A02-normal-qpc/frames.json
          test -f work-log/evidence/physical-native-final-20261024/B02-normal-qpc/frames.json
      - name: Inspect native original G28 QPC pixels
        shell: bash
        run: |
          python3 -u analysis/inspect_native_g28_qpc_frames.py
