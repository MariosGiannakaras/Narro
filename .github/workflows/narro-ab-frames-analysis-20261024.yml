name: Narro frozen-media evidence analysis bridge (isolated)
on:
  push:
    branches:
      - analysis/narro-20261024-exact-ab-frame-review
permissions:
  contents: read
jobs:
  original-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            analysis
      - name: Ensure video decoding tools
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          command -v ffprobe
          python3 --version
      - name: Freeze main source tree in checkout without changing original files
        shell: bash
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin main
          test -f analysis/inspect_20261025_frozen_ab_timer.py
          git cat-file -e FETCH_HEAD:work-log/evidence/physical-acceptance-20261025/README.md
      - name: Inspect 16 current native transitions and 1 normal-media Timer alert from original MKVs
        shell: bash
        run: |
          python3 -u analysis/inspect_20261025_frozen_ab_timer.py
