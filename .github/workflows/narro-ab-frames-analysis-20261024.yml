name: Narro original-frame analysis bridge (isolated)
on:
  push:
    branches:
      - analysis/narro-20261024-exact-ab-frame-review
permissions:
  contents: read
jobs:
  original-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            analysis
            work-log/evidence/physical-ab-20261024
      - name: Verify ffmpeg availability
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          python3 --version
      - name: Emit frame sheets from existing original video bytes
        shell: bash
        run: |
          NARRO_FRAME_SCOPE=rest12 python3 -u analysis/exact_ab_frame_review.py
