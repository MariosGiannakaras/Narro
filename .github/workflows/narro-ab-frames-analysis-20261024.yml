name: Narro frozen-media evidence analysis bridge (isolated)
on:
  push:
    branches:
      - analysis/narro-20261024-exact-ab-frame-review
permissions:
  contents: read
jobs:
  original-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            analysis
      - name: Verify original video toolchain and main evidence
        shell: bash
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          command -v ffprobe
          git fetch --no-tags --depth=1 --filter=blob:none origin main
          git cat-file -e FETCH_HEAD:work-log/evidence/all-remaining-physical-20261026/main-focus/native-original.mkv
      - name: Inspect P01 through P18 original physical journey frames
        shell: bash
        run: |
          python3 -u - <<'PY'
          import base64, datetime as dt, json, pathlib, subprocess, tempfile
          ROOT = "work-log/evidence/all-remaining-physical-20261026/"
          def git_bytes(path):
              return subprocess.run(["git", "show", "FETCH_HEAD:" + ROOT + path], capture_output=True, check=True).stdout
          def when(value):
              return dt.datetime.fromisoformat(value.replace("Z","+00:00"))
          def probe(path):
              return json.loads(git_bytes(path))
          cases = [
            ("P01-home-dark", "main-lists", "2026-10-26T06:36:34.076Z", "full"),
            ("P01-home-light", "main-lists", "2026-10-26T06:37:10.314Z", "full"),
            ("P02-image-upload", "main-lists", "2026-10-26T06:41:08.815Z", "full"),
            ("P05-archive", "main-lists", "2026-10-26T06:44:58.555Z", "full"),
            ("P15-reports-filter", "main-board", "2026-10-26T07:21:15.793Z", "full"),
            ("P16-session-commit", "main-board", "2026-10-26T07:23:01.573Z", "full"),
            ("P12-preferences", "main-board", "2026-10-26T07:24:42.534Z", "full"),
            ("P13-volume-success", "main-board", "2026-10-26T07:28:50.162Z", "full"),
            ("P06-focus-entry", "main-focus", "2026-10-26T07:31:31.841Z", "focus"),
            ("P10-compact-notes", "main-focus", "2026-10-26T07:36:00.734Z", "focus"),
            ("P15-done-long-scroll", "main-focus", "2026-10-26T07:38:44.169Z", "full"),
            ("P17-second-screen", "main-topology", "2026-10-26T07:45:03.428Z", "full"),
            ("P07-time-up", "resume-01/timer-boundaries", "2026-10-26T11:40:05.449Z", "right"),
            ("P07-extend-done", "resume-01/timer-boundaries", "2026-10-26T11:41:04.652Z", "right"),
            ("P08-break-skip", "main-break", "2026-10-26T07:51:27.920Z", "whole"),
            ("P08-break-natural", "resume-01/manual-break-expiry", "2026-10-26T11:46:55.829Z", "whole"),
            ("P14-rollback", "resume-01/preferences-write-failure", "2026-10-26T12:29:59.032Z", "primary"),
            ("P04-weekly-save", "resume-01/restart-persistence", "2026-10-26T11:33:33.577Z", "primary"),
            ("P04-weekly-persist", "resume-01/final-relaunch-persistence", "2026-10-26T12:33:34.430Z", "primary"),
            ("P18-relaunch", "resume-01/restart-persistence", "2026-10-26T11:30:55.548Z", "primary"),
          ]
          with tempfile.TemporaryDirectory() as td:
              target = pathlib.Path(td)
              cache = {}
              evidence = pathlib.Path("analysis/video-review-20261026")
              evidence.mkdir(parents=True,exist_ok=True)
              for label, segment, stamp, mode in cases:
                  start = probe(segment + "/start.json")
                  d = (when(stamp) - when(start["utc"])).total_seconds()
                  if segment not in cache:
                      video = target / ("video" + str(len(cache)) + ".mkv")
                      with video.open("wb") as o:
                          subprocess.run(["git", "show", "FETCH_HEAD:" + ROOT + segment + "/native-original.mkv"], stdout=o, check=True)
                      raw = subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(video)],capture_output=True,text=True,check=True)
                      cache[segment] = (video, float(raw.stdout.strip()), start)
                  video,duration,_ = cache[segment]
                  cover = 0<=d<=duration
                  print("VIDEO_COVERAGE|"+json.dumps({"case":label,"segment":segment,"relativeSeconds":round(d,3),"duration":round(duration,3),"covered":cover,"mode":mode},separators=(",",":")),flush=True)
                  if not cover: continue
                  # Six seconds pre-event plus at least three after: nine genuine PTS frames, no interpolation.
                  seek = max(0,d-6)
                  if mode=="focus":
                      vf="crop=850:900:1710:0,scale=620:-1:flags=lanczos"
                  elif mode=="right":
                      vf="crop=850:900:3630:0,scale=620:-1:flags=lanczos"
                  elif mode=="primary":
                      vf="crop=2560:1080:1920:0,scale=950:-1:flags=lanczos"
                  elif mode=="whole":
                      vf="scale=1100:-1:flags=lanczos"
                  else:
                      vf="scale=950:-1:flags=lanczos"
                  sheet = target / (label + ".jpg")
                  cmd=["ffmpeg","-hide_banner","-nostdin","-loglevel","error","-ss",str(round(seek,3)),"-i",str(video),"-t","9.5","-vf",vf+",fps=1,tile=3x3:padding=3:margin=3:color=black","-frames:v","1","-q:v","7","-y",str(sheet)]
                  subprocess.run(cmd,check=True)
                  data=sheet.read_bytes(); b64=base64.b64encode(data).decode()
                  (evidence / (label + ".b64.txt")).write_text(b64+"\n")
                  print("VIDEO_META|"+json.dumps({"case":label,"seek":round(seek,3),"bytes":len(data),"videoBytes":video.stat().st_size,"capture":"9 source PTS frames at 1fps; original pixel crop; descriptive still preview, not DWM present guarantee"},separators=(",",":")),flush=True)
                  print("VIDEO_BEGIN|"+label,flush=True)
                  for i in range(0,len(b64),3500): print("VIDEO_PART|"+label+"|"+b64[i:i+3500],flush=True)
                  print("VIDEO_END|"+label,flush=True)
              # Prove whether the original P03 event had any overlapping archived MKV recording.
              event = when("2026-10-26T06:47:36.727Z")
              mainlist = probe("main-lists/start.json")
              t = event - when(mainlist["utc"])
              video=target/"main-lists.mkv"
              with video.open("wb") as o:subprocess.run(["git","show","FETCH_HEAD:"+ROOT+"main-lists/native-original.mkv"],stdout=o,check=True)
              d=float(subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(video)],capture_output=True,text=True,check=True).stdout.strip())
              coverage={"event":"2026-10-26T06:47:36.727Z","recording":"main-lists/native-original.mkv","eventRelativeSeconds":round(t.total_seconds(),3),"recordedSeconds":round(d,3),"covered":0<=t.total_seconds()<=d,"nextSegment":"main-board starts 07:20:15Z"}
              (evidence/"P03-video-coverage.json").write_text(json.dumps(coverage,indent=2)+"\n")
              print("P03_VIDEO_SCOPE|"+json.dumps(coverage,separators=(",",":")),flush=True)
          print("VIDEO_REVIEW_DONE|"+str(len(cases)),flush=True)
          PY
