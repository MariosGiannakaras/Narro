name: Narro frozen-media evidence analysis bridge (isolated)
on:
  push:
    branches:
      - analysis/narro-20261024-exact-ab-frame-review
permissions:
  contents: read
jobs:
  original-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            analysis
      - name: Verify FFmpeg and frozen artifact availability
        shell: bash
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          git fetch --no-tags --depth=1 --filter=blob:none origin main
          git cat-file -e FETCH_HEAD:work-log/evidence/physical-acceptance-20261025/topology/secondary-normal-alert/native-original.mkv
      - name: Review remaining normal-media Timer flash interval only
        shell: bash
        run: |
          python3 -u analysis/inspect_20261025_alert_full.py
