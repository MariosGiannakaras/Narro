name: Narro frozen-media evidence analysis bridge (isolated)
on:
  push:
    branches:
      - analysis/narro-20261024-exact-ab-frame-review
permissions:
  contents: read
jobs:
  original-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            analysis
            work-log/evidence/physical-gap-restart-20261024/exports
      - name: Verify ffmpeg availability
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          command -v pdfinfo
          command -v pdftoppm
          python3 --version
      - name: Inspect existing original Reports PDF pages
        shell: bash
        run: |
          python3 -u analysis/inspect_g22_export.py
