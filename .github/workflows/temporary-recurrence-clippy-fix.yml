name: Temporary Recurrence Clippy Fix

on:
  push:
    branches:
      - m2-recurrence-metadata

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Refactor recurrence normalization input') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-recurrence-metadata
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refactor normalization helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import re

          path = Path('src-tauri/src/persistence/recurrence.rs')
          text = path.read_text(encoding='utf-8')

          start = text.index('fn normalize_rule_input(')
          end_marker = '\nfn decode_bool('
          end = text.index(end_marker, start)
          new_fn = '''struct RuleMetadataInput {
              interval_count: u32,
              unit: RecurrenceUnit,
              weekday_mask: u8,
              month_day: Option<u8>,
              starts_local_date: String,
              local_time: Option<String>,
              timezone: Option<String>,
              replace_existing: bool,
          }

          fn normalize_rule_input(
              input: RuleMetadataInput,
          ) -> Result<NormalizedRuleInput, RecurrenceStoreError> {
              if input.interval_count == 0 {
                  return Err(RecurrenceStoreError::InvalidInterval);
              }
              validate_pattern(input.unit, input.weekday_mask, input.month_day)?;
              let starts_local_date = normalize_local_date(&input.starts_local_date)?;
              let (local_time, timezone) =
                  normalize_time_and_timezone(input.local_time, input.timezone)?;

              Ok(NormalizedRuleInput {
                  interval_count: i64::from(input.interval_count),
                  unit: input.unit,
                  weekday_mask: input.weekday_mask,
                  month_day: input.month_day,
                  starts_local_date,
                  local_time,
                  timezone,
                  replace_existing: input.replace_existing,
              })
          }
          '''
          text = text[:start] + new_fn + text[end:]

          call_pattern = re.compile(
              r'let normalized = normalize_rule_input\(\s*'
              r'input\.interval_count,\s*input\.unit,\s*input\.weekday_mask,\s*'
              r'input\.month_day,\s*input\.starts_local_date,\s*input\.local_time,\s*'
              r'input\.timezone,\s*input\.replace_existing,\s*\)\?;'
          )
          new_call = '''let normalized = normalize_rule_input(RuleMetadataInput {
              interval_count: input.interval_count,
              unit: input.unit,
              weekday_mask: input.weekday_mask,
              month_day: input.month_day,
              starts_local_date: input.starts_local_date,
              local_time: input.local_time,
              timezone: input.timezone,
              replace_existing: input.replace_existing,
          })?;'''
          text, count = call_pattern.subn(new_call, text)
          if count != 2:
              raise SystemExit(f'expected two normalize_rule_input calls, found {count}')

          path.write_text(text, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit refactor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain -- src-tauri/src/persistence/recurrence.rs)) {
            throw 'Expected recurrence.rs changes were not produced.'
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/persistence/recurrence.rs
          git commit -m "Refactor recurrence normalization input"
          git push origin HEAD:m2-recurrence-metadata
