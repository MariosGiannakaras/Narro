name: Windows CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
        components: rustfmt, clippy

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Print Versions
      run: |
        node -v
        npm -v
        rustc -V
        cargo -V
        rustfmt -V
        cargo clippy -V

    - name: Run Repository Preflight
      run: npm run preflight

    - name: Build Tauri Release
      run: npm run tauri build

    - name: Upload Diagnostic Harness Artifact
      uses: actions/upload-artifact@v4
      with:
        name: narro-m1-runtime-harness-windows-x64
        path: |
          src-tauri/target/release/narro.exe
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/msi/*.msi
        if-no-files-found: error
