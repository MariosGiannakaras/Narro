name: Lockfile Snapshot

on:
  push:
    branches:
      - ai/m4-timezone-dst

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/m4-timezone-dst
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo lock metadata
        shell: pwsh
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-Null
      - name: Commit refreshed lockfile if changed
        shell: pwsh
        run: |
          if (git diff --quiet -- src-tauri/Cargo.lock) {
            Write-Host "Cargo.lock already synchronized"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "Refresh Cargo lock for timezone dependency"
          git push origin HEAD:ai/m4-timezone-dst
