name: Autostart Implementation

on:
  push:
    branches: [ "m1-windows-autostart" ]
    paths:
      - ".github/workflows/autostart-implement.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1-windows-autostart
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply autostart implementation
        run: python .github/scripts/autostart_implement.py
      - name: Generate lockfile and format Rust
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Remove temporary implementation files and commit
        shell: pwsh
        run: |
          git rm .github/workflows/autostart-implement.yml .github/scripts/autostart_implement.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/src/autostart/mod.rs src-tauri/src/error.rs src-tauri/src/lib.rs src/App.tsx
          git commit -m "Implement Windows autostart diagnostics"
          git push origin HEAD:m1-windows-autostart
