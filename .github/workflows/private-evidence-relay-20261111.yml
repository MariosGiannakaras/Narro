name: Temporary encrypted Nov11 evidence relay (never merge)
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/private-evidence-relay-20261111.yml]
permissions:
  contents: write
jobs:
  relay:
    if: github.event.pull_request.head.repo.full_name == 'MariosGiannakaras/Narro' && github.event.pull_request.head.ref == 'chore/private-evidence-ci-relay-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        group: [earlier-small, earlier-large]
    steps:
      - name: Retrieve pinned private draft assets, verify hashes and encrypt before upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          set -euo pipefail
          export WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT
          mkdir -p "encrypted-relay/$GROUP"
          node <<'NODE'
          const fs = require('node:fs');
          const fsp = require('node:fs/promises');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const { pipeline } = require('node:stream/promises');
          const { createReadStream, createWriteStream } = require('node:fs');
          const { createHash, randomBytes, createCipheriv, publicEncrypt, constants } = require('node:crypto');
          const repo = process.env.GH_REPO;
          if (repo !== 'MariosGiannakaras/Narro') throw Error('Unexpected repository');
          const group = process.env.GROUP;
          const latest = [
            [441646234,735401500],[441643011,735392668],[441630459,735355874],[441617473,735317412],
            [441298380,734363077],
            [440970786,735406479],[440970786,735406476],[440970786,735406478],[440970786,735406475],
            [440970786,735404506],[440970786,735404507],[440970786,735406611]
          ];
          const earlier = [
            [441294244,734346495],
            [440970786,733142259],[440970786,733234599],[440970786,733236076],
            [440970786,733252933],[440970786,733256388],[440970786,733260065],[440970786,733266844],
            [440970786,734457161]
          ];
          const pinned = group === 'earlier-small' ? earlier.filter(([r,a])=>a!==734346495) : group === 'earlier-large' ? earlier.filter(([r,a])=>a===734346495) : null;
          if (!pinned) throw Error('Unexpected group');
          const publicKey = `-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAuBeA6bC+eJA1MuoaDfdQ
          WHMNxk3CZ6z+oCV2Z/MwNvwRzK9NJILpmjvRxev1R9cwEUA2WRyZRq1dDmkhpv7G
          kvS4vGJa6MVRpK0/4t/Dw9PrZd0ewA5KrsHa2ox+mOXkw+l1AHgAL5leV0KNERl9
          JEdPpBfzCBcFpefLoAfWI4BZD8zaajhL7cPnoVg2L0dHV2GMQ8VWLaJ7uP5WhbG5
          LLpFGOgt2eoTmi1+h0DGx4995jMNWTokrGtbRyWmxoaAQv6WMecBLzwyDILAolDV
          1ViR+rmi+dB9uDAa1GxmPmYK4hdD2DhMElacs1x/gik2ZZvw53LtcRH8hB7AnVs1
          mN6RhmnV0YCbi3J4AUSL2A8O6rIzm47RQSmNp07InaAbrFYPH5gZtS0eXG4TL0V8
          igSaO+yDLCHL6SrLCOWjVbmcaU9feNd9VvRiCNmRPUS7zpTBTiT5WRycgpNSMPL1
          9UbHFwioh3rGIzBzFQInWqDmjfcVgjNqAVC/iazhg165AgMBAAE=
          -----END PUBLIC KEY-----`;
          function gh(args) { return execFileSync('gh',args,{encoding:'utf8',stdio:['ignore','pipe','pipe']}); }
          async function digest(file) {
            const hash = createHash('sha256');
            for await (const b of createReadStream(file)) hash.update(b);
            return hash.digest('hex');
          }
          (async () => {
            const releases = new Map();
            for (const [releaseId, assetId] of pinned) {
              if (!releases.has(releaseId)) {
                const r=JSON.parse(gh(['api','repos/'+repo+'/releases/'+releaseId]));
                if (!r.draft || r.published_at !== null) throw Error('Refusing non-draft release '+releaseId);
                releases.set(releaseId,r);
              }
              const release=releases.get(releaseId);
              const meta=JSON.parse(gh(['api','repos/'+repo+'/releases/assets/'+assetId]));
              if (!release.assets.some(a=>a.id===assetId && a.name===meta.name) ||
                  meta.state!=='uploaded' || !/^sha256:[0-9a-f]{64}$/.test(meta.digest) ||
                  !/\.(zip|json)$/.test(meta.name))
                throw Error('Pinned private asset mismatch '+assetId);
              const dir=path.join(process.env.WORK_DIR,String(assetId));
              fs.mkdirSync(dir,{recursive:true});
              gh(['release','download',release.tag_name,'--repo',repo,'--pattern',meta.name,'--dir',dir]);
              const raw=path.join(dir,meta.name);
              const stat=await fsp.stat(raw);
              if (stat.size!==meta.size || 'sha256:'+(await digest(raw))!==meta.digest)
                throw Error('Downloaded private bytes hash mismatch '+assetId);
              const key=randomBytes(32),nonce=randomBytes(12);
              const wrapped=publicEncrypt({key:publicKey,oaepHash:'sha256',padding:constants.RSA_PKCS1_OAEP_PADDING},key);
              const envelope={format:'narro-relay/aes-256-gcm-rsa-oaep-sha256/v1',
                releaseId,assetId,name:meta.name,size:meta.size,sha256:meta.digest.slice(7),
                nonce:nonce.toString('base64'),wrappedKey:wrapped.toString('base64')};
              const output=path.join('encrypted-relay',group,String(assetId)+'.gcm');
              await fsp.writeFile(output,JSON.stringify(envelope)+'\n',{flag:'wx'});
              const cipher=createCipheriv('aes-256-gcm',key,nonce);
              await pipeline(createReadStream(raw),cipher,createWriteStream(output,{flags:'a'}));
              await fsp.appendFile(output,cipher.getAuthTag());
              await fsp.rm(dir,{recursive:true,force:true});
              console.log('Privately downloaded, SHA-verified and AES-encrypted ID='+assetId+' bytes='+meta.size+' (no raw data in Actions artifacts)');
            }
          })().catch(e=>{console.error('Relay failure: '+e.message);process.exitCode=1});
          NODE
      - name: Split large ciphertext below transport limit (still encrypted)
        if: matrix.group == 'earlier-large'
        shell: bash
        run: |
          set -euo pipefail
          split -b 300000000 encrypted-relay/earlier-large/734346495.gcm encrypted-relay/earlier-large/734346495.gcm.part
          rm encrypted-relay/earlier-large/734346495.gcm
      - name: Upload small earlier ciphertext
        if: matrix.group == 'earlier-small'
        uses: actions/upload-artifact@v4
        with:
          name: narro-nov11-earlier-small-encrypted
          path: encrypted-relay/earlier-small/*.gcm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload big encrypted part A
        if: matrix.group == 'earlier-large'
        uses: actions/upload-artifact@v4
        with:
          name: narro-nov11-earlier-big-part-a
          path: encrypted-relay/earlier-large/*.partaa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload big encrypted part B
        if: matrix.group == 'earlier-large'
        uses: actions/upload-artifact@v4
        with:
          name: narro-nov11-earlier-big-part-b
          path: encrypted-relay/earlier-large/*.partab
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload big encrypted part C
        if: matrix.group == 'earlier-large'
        uses: actions/upload-artifact@v4
        with:
          name: narro-nov11-earlier-big-part-c
          path: encrypted-relay/earlier-large/*.partac
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Purge local workspace
        if: always()
        run: rm -rf encrypted-relay
