name: Notification Lockfile Generator

on:
  push:
    branches: [ "m1-windows-notifications" ]
    paths:
      - "src-tauri/Cargo.toml"

jobs:
  generate-lockfile:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate updated Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Upload Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: narro-notification-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
