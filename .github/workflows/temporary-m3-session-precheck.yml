name: Temporary M3 Session Persistence Precheck

on:
  push:
    branches:
      - m3-session-persistence-recovery

permissions:
  contents: write

jobs:
  precheck:
    if: ${{ !contains(github.event.head_commit.message, 'Apply M3 session precheck fixes') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-session-persistence-recovery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Wire modules and migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          persistence = Path('src-tauri/src/persistence/mod.rs')
          text = persistence.read_text()
          if 'pub mod sessions;' not in text:
              text = text.replace('pub mod recurrence;\n', 'pub mod recurrence;\npub mod sessions;\n', 1)
          migration2 = '        M::up(include_str!("../../migrations/0002_domain_foundation.sql")),\n'
          migration3 = migration2 + '        M::up(include_str!("../../migrations/0003_focus_runtime_recovery.sql")),\n'
          if '0003_focus_runtime_recovery.sql' not in text:
              if migration2 not in text:
                  raise SystemExit('could not locate migration 0002 insertion point')
              text = text.replace(migration2, migration3, 1)
          if '"focus_runtime_recovery",' not in text:
              marker = '            "preferences",\n'
              if marker not in text:
                  raise SystemExit('could not locate migration table assertion insertion point')
              text = text.replace(marker, marker + '            "focus_runtime_recovery",\n', 1)
          persistence.write_text(text)

          timer = Path('src-tauri/src/timer/mod.rs')
          text = timer.read_text()
          if 'mod recovery;' not in text:
              marker = 'use crate::domain::ids::TaskId;\n'
              if marker not in text:
                  raise SystemExit('could not locate timer module insertion point')
              text = text.replace(
                  marker,
                  'mod recovery;\npub use recovery::{TimerRecoveryError, TimerRecoveryState};\n\n' + marker,
                  1,
              )
          timer.write_text(text)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust format
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Rust check
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust Clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Commit validated wiring and formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain -- src-tauri)) {
            Write-Host 'No source changes required.'
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "Apply M3 session precheck fixes"
          git push origin HEAD:m3-session-persistence-recovery
