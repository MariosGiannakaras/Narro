name: Temporary M3 Session Precheck

on:
  push:
    branches:
      - m3-session-persistence-primitives

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[m3-session-precheck]') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-session-persistence-primitives
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Register session modules and migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          from pathlib import Path

          domain = Path("src-tauri/src/domain/mod.rs")
          text = domain.read_text(encoding="utf-8")
          if "pub mod sessions;" not in text:
              anchor = "pub mod recurrence;\npub mod subtasks;\n"
              if text.count(anchor) != 1:
                  raise SystemExit("domain module anchor mismatch")
              text = text.replace(anchor, "pub mod recurrence;\npub mod sessions;\npub mod subtasks;\n", 1)
              domain.write_text(text, encoding="utf-8")

          persistence = Path("src-tauri/src/persistence/mod.rs")
          text = persistence.read_text(encoding="utf-8")
          if "pub mod sessions;" not in text:
              anchor = "pub mod recurrence;\npub mod subtasks;\n"
              if text.count(anchor) != 1:
                  raise SystemExit("persistence module anchor mismatch")
              text = text.replace(anchor, "pub mod recurrence;\npub mod sessions;\npub mod subtasks;\n", 1)
          migration = '        M::up(include_str!("../../migrations/0002_domain_foundation.sql")),\n'
          if "0003_session_runtime.sql" not in text:
              if text.count(migration) != 1:
                  raise SystemExit("migration anchor mismatch")
              text = text.replace(
                  migration,
                  migration + '        M::up(include_str!("../../migrations/0003_session_runtime.sql")),\n',
                  1,
              )
          persistence.write_text(text, encoding="utf-8")
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Harden live-session list lifecycle guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          from pathlib import Path

          path = Path("src-tauri/src/persistence/sessions.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "use crate::domain::ids::{SessionId, TaskId};\n",
                  "use crate::domain::ids::{ListId, SessionId, TaskId};\n",
              ),
              (
                  "use crate::persistence::tasks::{get_task, TaskStoreError};\n",
                  "use crate::persistence::lists::{get_list, ListStoreError};\nuse crate::persistence::tasks::{get_task, TaskStoreError};\n",
              ),
              (
                  "    Task(TaskStoreError),\n    Decode(SessionDecodeError),\n",
                  "    Task(TaskStoreError),\n    List(ListStoreError),\n    Decode(SessionDecodeError),\n",
              ),
              (
                  "    TaskCompleted(TaskId),\n    NoOpenWorkSession,\n",
                  "    TaskCompleted(TaskId),\n    ListArchived(ListId),\n    NoOpenWorkSession,\n",
              ),
              (
                  "            Self::Task(error) => Display::fmt(error, formatter),\n            Self::Decode(error) => Display::fmt(error, formatter),\n",
                  "            Self::Task(error) => Display::fmt(error, formatter),\n            Self::List(error) => Display::fmt(error, formatter),\n            Self::Decode(error) => Display::fmt(error, formatter),\n",
              ),
              (
                  "            Self::TaskCompleted(id) => {\n                write!(formatter, \"cannot start live session for completed task: {id}\")\n            }\n            Self::NoOpenWorkSession => {\n",
                  "            Self::TaskCompleted(id) => {\n                write!(formatter, \"cannot start live session for completed task: {id}\")\n            }\n            Self::ListArchived(id) => {\n                write!(formatter, \"cannot start live session in archived list: {id}\")\n            }\n            Self::NoOpenWorkSession => {\n",
              ),
              (
                  "            Self::Task(error) => Some(error),\n            Self::Decode(error) => Some(error),\n",
                  "            Self::Task(error) => Some(error),\n            Self::List(error) => Some(error),\n            Self::Decode(error) => Some(error),\n",
              ),
              (
                  "impl From<SessionDecodeError> for SessionStoreError {\n",
                  "impl From<ListStoreError> for SessionStoreError {\n    fn from(value: ListStoreError) -> Self {\n        Self::List(value)\n    }\n}\n\nimpl From<SessionDecodeError> for SessionStoreError {\n",
              ),
              (
                  "    if task.completed_at.is_some() {\n        return Err(SessionStoreError::TaskCompleted(task_id));\n    }\n    Ok(())\n",
                  "    if task.completed_at.is_some() {\n        return Err(SessionStoreError::TaskCompleted(task_id));\n    }\n    let list = get_list(conn, task.list_id)?;\n    if list.archived_at.is_some() {\n        return Err(SessionStoreError::ListArchived(task.list_id));\n    }\n    Ok(())\n",
              ),
              (
                  "    use crate::persistence::lists::create_list;\n",
                  "    use crate::persistence::lists::{archive_list, create_list};\n",
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"session patch anchor mismatch: {old[:60]!r}")
              text = text.replace(old, new, 1)

          test_anchor = "        assert!(matches!(\n            start_work_session(&mut conn, archived, SessionSource::Focus, T3),\n            Err(SessionStoreError::TaskArchived(id)) if id == archived\n        ));\n"
          test_block = test_anchor + "\n        let archived_list_task = task_fixture(&mut conn, \"Archived list\");\n        let owning_list = get_task(&conn, archived_list_task)\n            .expect(\"load archived-list task\")\n            .list_id;\n        archive_list(&mut conn, owning_list, T3).expect(\"archive owning list\");\n        assert!(matches!(\n            start_work_session(&mut conn, archived_list_task, SessionSource::Focus, T4),\n            Err(SessionStoreError::ListArchived(id)) if id == owning_list\n        ));\n"
          if "let archived_list_task = task_fixture" not in text:
              if text.count(test_anchor) != 1:
                  raise SystemExit("archived-list test anchor mismatch")
              text = text.replace(test_anchor, test_block, 1)

          path.write_text(text, encoding="utf-8")
          '@
          $script | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format and validate Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit validated patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain -- src-tauri)) {
            Write-Host 'No source changes required.'
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "Validate M3 session persistence [m3-session-precheck]"
          git push origin HEAD:m3-session-persistence-primitives
