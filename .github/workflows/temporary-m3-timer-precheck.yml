name: Temporary M3 Timer Precheck

on:
  push:
    branches:
      - m3-timer-state-machine

permissions:
  contents: write

jobs:
  precheck:
    if: ${{ !contains(github.event.head_commit.message, 'Apply M3 timer rustfmt') }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-timer-state-machine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check timer source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit formatting when needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain -- src-tauri/src src-tauri/tests)) {
            Write-Host 'No rustfmt changes required.'
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src src-tauri/tests
          git commit -m "Apply M3 timer rustfmt"
          git push origin HEAD:m3-timer-state-machine
