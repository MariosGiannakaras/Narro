name: Rebuild Narro brand logo

on:
  push:
    paths:
      - 'assets/branding/.logo-upload/**'
      - '.github/workflows/rebuild-brand-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild verified logo
        shell: bash
        run: |
          set -euo pipefail
          cat assets/branding/.logo-upload/part-* | tr -d '\n\r ' | base64 --decode > assets/branding/narro-logo.webp
          test "$(stat -c%s assets/branding/narro-logo.webp)" = "71744"
          echo "c3241672ad145d720ec856a05b05337bab471db6a98d3be563df1d648637cc33  assets/branding/narro-logo.webp" | sha256sum -c -
      - name: Commit rebuilt logo
        shell: bash
        run: |
          if git diff --quiet -- assets/branding/narro-logo.webp; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/narro-logo.webp
          git commit -m "Replace Narro logo with high-quality 512px asset"
          git push
