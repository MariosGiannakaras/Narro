name: Temporary M3 Coordinator Precheck

on:
  push:
    branches:
      - m3-timer-session-coordinator

permissions:
  contents: write

jobs:
  precheck:
    if: ${{ !contains(github.event.head_commit.message, 'Apply M3 coordinator patch') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m3-timer-session-coordinator
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/temporary_m3_coordinator_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format and validate Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit patched source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          if (-not (git status --porcelain -- src-tauri/src)) {
            throw 'M3 coordinator patch produced no source changes.'
          }
          git commit -m "Apply M3 coordinator patch"
          git push origin HEAD:m3-timer-session-coordinator
