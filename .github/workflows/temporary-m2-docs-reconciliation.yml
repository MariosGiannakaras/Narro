name: Temporary M2 Docs Reconciliation

on:
  push:
    branches:
      - m2-final-docs-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'Reconcile completed Milestone 2 docs') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2-final-docs-reconciliation
      - name: Reconcile docs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/temporary-reconcile-m2-docs.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md STATUS.md HANDOFF.md work-log/2026-09-04-chatgpt-m2-completion.md
          git commit -m "Reconcile completed Milestone 2 docs"
          git push origin HEAD:m2-final-docs-reconciliation
